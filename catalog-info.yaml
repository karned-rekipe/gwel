apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: rekipe-gwel
  title: Gwel
  description: Interface Vue de gestion des recettes, ingrédients, planning et courses Rekipe.
  annotations:
    github.com/project-slug: karned-rekipe/gwel
    backstage.io/kubernetes-id: rekipe-gwel
    backstage.io/kubernetes-namespace: rekipe
    backstage.io/source-location: url:https://github.com/karned-rekipe/gwel/tree/main/
    backstage.io/techdocs-ref: dir:.
  tags: [frontend, typescript, vite, vue]
  links:
    - url: https://rekipe.amazone.lan
      title: Préproduction Rekipe
      icon: web
    - url: https://github.com/karned-rekipe/gwel
      title: Dépôt applicatif
      icon: github
    - url: https://github.com/killiankopp/amazone-gitops-karned/tree/main/applications/rekipe
      title: Déploiement GitOps
      icon: github
spec:
  type: website
  lifecycle: production
  owner: user:default/skit
  system: system:default/rekipe
  consumesApis:
    - api:default/rekipe-recipe-http
    - api:default/rekipe-agent-http
    - api:default/rekipe-media-http
  dependsOn:
    - component:default/rekipe-recipe
    - component:default/rekipe-agent-recipe-creator
    - component:default/rekipe-media
    - resource:default/rekipe-keycloak
    - resource:default/kamazone-cluster
